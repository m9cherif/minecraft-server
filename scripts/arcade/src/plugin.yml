name: Arcade
version: 0.1.0
main: com.baarcha.arcade.Arcade
api-version: '1.13'
description: Eleven playable hub gamemodes (SkyWars, PvP, KitPvP, Duels, Sumo, Parkour, Skyblock, Murder Mystery, Capture the Flag, Hide and Seek, Build Fights) on one shared engine.
author: Baarcha
softdepend: [HubCompass, AGame, OnJoinSpawn]
commands:
  arcade:
    description: Arcade gamemode hub
    usage: /arcade [join <mode>|leave|list|stop]
  bfgame:
    description: Build Fights internal voting
    usage: /bfgame vote <number>
