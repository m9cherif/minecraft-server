# Simple Voice Chat — server side.
# Only the settings worth changing are listed; the mod appends its remaining
# defaults on first start.

# UDP port for voice traffic. This is SEPARATE from the TCP game port and must
# be forwarded too. -1 makes it follow server-port from server.properties.
port=24454

# Leave empty to bind every interface, same as the game port.
bind_address=

# Metres at which voices fade out / go silent.
voice_chat_fade_distance=48
voice_chat_distance=48

# Player-created groups (party chat regardless of distance).
enable_groups=true

# Lets clients save recordings of what they hear.
allow_recording=true

# Raise if voice cuts out behind a VPN or a restrictive router (min 256).
mtu_size=1024
