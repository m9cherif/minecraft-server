# Minecraft 26.2 / Fabric — tuned for a 16 GB host.
# Anything not listed here is left at the vanilla default; the server rewrites
# this file on first run and fills the rest in.

motd=§bFabric 26.2 §7| §aVeinminer §7+ §aVoice Chat
server-port=25565

# --- Authentication -------------------------------------------------------
# Cracked server: Mojang accounts are NOT verified, so anyone can connect under
# any username. enforce-secure-profile must be off, since offline players have
# no signed chat keys. See the security note in README.md.
online-mode=false
enforce-secure-profile=false
prevent-proxy-connections=false

# --- Access ---------------------------------------------------------------
# Turn both of these on to lock the server to names in whitelist.json.
white-list=false
enforce-whitelist=false
max-players=100
player-idle-timeout=0

# --- World ----------------------------------------------------------------
level-name=world
level-seed=
level-type=minecraft\:normal
generate-structures=true
# 29999984 is the engine maximum — the world border is not narrowed here.
max-world-size=29999984
allow-nether=true
spawn-protection=0
difficulty=normal
gamemode=survival
force-gamemode=false
hardcore=false
pvp=true
allow-flight=true
spawn-monsters=true

# --- Performance ----------------------------------------------------------
# view-distance is the single biggest cost per player. 12 is comfortable at
# this heap size; drop to 8-10 if you run close to 100 concurrent players.
view-distance=12
simulation-distance=10
entity-broadcast-range-percentage=100
# false lets the OS batch chunk writes instead of fsyncing each one. Much
# faster, at the cost of losing the last few seconds of chunk data on a hard
# power loss (a clean /stop or crash-restart is unaffected).
sync-chunk-writes=false
use-native-transport=true
network-compression-threshold=512
# -1 disables the watchdog. Large world generation and big modded chunk loads
# can exceed the default 60s and kill an otherwise healthy server; start.sh
# restarts on a real crash anyway.
max-tick-time=-1
max-chained-neighbor-updates=1000000
# 0 keeps the server ticking with nobody online, so farms and timers keep
# running. Set to 60 to let it idle instead.
pause-when-empty-seconds=0

# --- Admin ----------------------------------------------------------------
enable-command-block=true
op-permission-level=4
function-permission-level=2
broadcast-console-to-ops=true
enable-status=true
hide-online-players=false
log-ips=true

# --- Remote console (off by default; set a password before enabling) ------
enable-rcon=false
rcon.port=25575
rcon.password=
enable-query=false
query.port=25565
