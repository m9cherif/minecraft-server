# Minecraft 26.2 / Fabric — tuned for a 2 GB heap.
# Anything not listed here is left at the vanilla default; the server rewrites
# this file on first run and fills the rest in.

motd=§bFabric 26.2 §7| §aVeinminer
server-port=25565

# --- Authentication -------------------------------------------------------
# Cracked server: Mojang accounts are NOT verified, so anyone can connect under
# any username. enforce-secure-profile must be off, since offline players have
# no signed chat keys. See the security note in README.md.
online-mode=false
enforce-secure-profile=false
prevent-proxy-connections=false

# --- Access ---------------------------------------------------------------
# Turn both of these on to lock the server to names in whitelist.json.
white-list=false
enforce-whitelist=false
# 20 is what a 2 GB heap actually holds with room to spare. The ceiling is
# memory, not a setting: each player loads their own chunks, so raising this
# without raising HEAP just moves the failure from "server is full" to
# "server dies with OutOfMemoryError". Raise both together or neither.
max-players=20
# Kick idle players after 30 minutes. On a small host their loaded chunks are
# the expensive part, and they are not using them. 0 disables it.
player-idle-timeout=30

# --- World ----------------------------------------------------------------
level-name=world
level-seed=
level-type=minecraft\:normal
generate-structures=true
# 29999984 is the engine maximum — the world border is not narrowed here.
max-world-size=29999984
allow-nether=true
spawn-protection=0
difficulty=normal
gamemode=survival
force-gamemode=false
hardcore=false
pvp=true
allow-flight=true
spawn-monsters=true

# --- Performance ----------------------------------------------------------
# view-distance is by far the largest cost per player, and it scales with the
# square: 8 loads 289 chunks per player, 12 loads 625 — more than twice the
# memory for one number. 8 is the setting that makes a 2 GB heap workable and
# is still comfortable to play at. Raise it only after raising HEAP.
view-distance=8
# How far the world actually ticks: mobs, redstone, growth. Cheaper than
# view-distance but the same shape of cost. 6 is the small-host number.
simulation-distance=6
# Entities stop being broadcast at 75% of view-distance. Mob-heavy areas are
# the usual cause of lag spikes on a small server, and this is the cheapest
# lever against them.
entity-broadcast-range-percentage=75
# false lets the OS batch chunk writes instead of fsyncing each one. Much
# faster, at the cost of losing the last few seconds of chunk data on a hard
# power loss (a clean /stop or crash-restart is unaffected).
sync-chunk-writes=false
use-native-transport=true
network-compression-threshold=512
# -1 disables the watchdog. Large world generation and big modded chunk loads
# can exceed the default 60s and kill an otherwise healthy server; start.sh
# restarts on a real crash anyway.
max-tick-time=-1
max-chained-neighbor-updates=1000000
# 0 keeps the server ticking with nobody online, so farms and timers keep
# running. On a 2 GB host, setting this to 60 is the single largest saving
# available — an empty server costs nothing — at the price of farms stopping
# while nobody is on. Left at 0 because that is a gameplay decision, not a
# tuning one.
pause-when-empty-seconds=0

# --- Admin ----------------------------------------------------------------
enable-command-block=true
op-permission-level=4
function-permission-level=2
broadcast-console-to-ops=true
enable-status=true
hide-online-players=false
log-ips=true

# --- Remote console (off by default; set a password before enabling) ------
enable-rcon=false
rcon.port=25575
rcon.password=
enable-query=false
query.port=25565
